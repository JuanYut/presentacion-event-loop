<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>01 · JS es single-threaded</title>
  <link rel="stylesheet" href="../vendor/fuentes/fuentes.css">
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    /* Vía única por la que pasan las instrucciones */
    .hilo__via {
      position: absolute;
      left: 0;
      right: 0;
      top: 539px;
      height: 2px;
      background: repeating-linear-gradient(90deg,
        var(--acento-suave) 0 24px, transparent 24px 40px);
    }

    /* Posición del slot y de las instrucciones (el aspecto está en shared).
       Todas las instrucciones parten centradas en el slot; GSAP las desplaza con `x`. */
    .hilo .slide__slot   { left: 410px; top: 410px; width: 260px; height: 260px; }
    .hilo .slide__bloque { left: 475px; top: 475px; }
  </style>
</head>
<body>

<div class="stage stage--cuadrado stage--slide hilo">

  <div class="hilo__via"></div>

  <div class="slide__slot" id="slot">
    <div class="slide__progreso" id="progreso"></div>
  </div>

  <!-- Las instrucciones. Agrega o quita bloques libremente: la timeline
       se genera recorriendo todos los .slide__bloque en orden. -->
  <div class="slide__bloque">1</div>
  <div class="slide__bloque">2</div>
  <div class="slide__bloque">3</div>
  <div class="slide__bloque">4</div>
  <div class="slide__bloque">5</div>

  <div class="ayuda oculto">
    <div class="ayuda__tarjeta">
      <h2>Controles</h2>
      <table>
        <tr><td><kbd>Espacio</kbd></td><td>Play / pausa</td></tr>
        <tr><td><kbd>R</kbd></td><td>Volver al inicio</td></tr>
        <tr><td><kbd>→</kbd> <kbd>←</kbd></td><td>Siguiente / anterior paso</td></tr>
        <tr><td><kbd>H</kbd></td><td>Mostrar / ocultar esta ayuda</td></tr>
      </table>
    </div>
  </div>
  <div class="pista">Espacio para empezar · H ayuda</div>

</div>

<script src="../vendor/gsap.min.js"></script>
<script src="../shared/controls.js"></script>
<script>
  const bloques  = gsap.utils.toArray('.slide__bloque');
  const slot     = document.getElementById('slot');
  const progreso = document.getElementById('progreso');

  // ---------- Medidas y tiempos de esta escena ----------
  const PASO      = 160;   // distancia entre bloques en la fila (130 ancho + 30 hueco)
  const ESPERA_X  = -235;  // x del primer bloque en espera (justo a la izquierda del slot)
  const SALIDA_X  = 700;   // hasta dónde se va un bloque al terminar (fuera del cuadrado)
  const T_EJECUTA = 1.0;   // segundos que tarda "ejecutarse" cada instrucción
  const EMPUJE    = 36;    // cuánto intenta entrar el siguiente bloque mientras hay uno ejecutando
  // Colores leídos del CSS (GSAP necesita el valor literal para animar el borde)
  const estilo       = getComputedStyle(document.querySelector('.stage'));
  const ACENTO       = estilo.getPropertyValue('--acento').trim();
  const ACENTO_SUAVE = estilo.getPropertyValue('--acento-suave').trim();

  // Posición x de un bloque según su lugar en la fila: 0 = dentro del slot,
  // 1 = primero esperando, 2 = segundo esperando, ...
  const posicionX = (lugar) => (lugar === 0 ? 0 : ESPERA_X - (lugar - 1) * PASO);

  // Estado inicial: todos en la fila, el primero pegado al slot
  bloques.forEach((b, i) => gsap.set(b, { x: posicionX(i + 1) }));

  // ---------- Timeline ----------
  const tl = gsap.timeline({
    paused: true,
    defaults: { duration: DUR.normal, ease: EASE.suave },
  });

  tl.addLabel('inicio');
  esperar(tl, DUR.margen);

  bloques.forEach((bloque, i) => {
    const siguiente = bloques[i + 1];

    // 1) La fila avanza un lugar: el bloque i entra al slot, el resto se acerca
    tl.addLabel(`instruccion-${i + 1}`);
    bloques.slice(i).forEach((b, j) => {
      tl.to(b, { x: posicionX(j), duration: DUR.lenta, ease: EASE.mover }, j === 0 ? undefined : '<');
    });

    // 2) Se ejecuta: el slot se enciende y la barra se llena
    tl.to(slot, { borderColor: ACENTO, duration: DUR.rapida });
    tl.fromTo(progreso,
      { scaleX: 0, autoAlpha: 1 },
      { scaleX: 1, duration: T_EJECUTA, ease: 'none' }, '<');

    // Mientras tanto, el siguiente intenta entrar y no puede (rebota)
    if (siguiente) {
      tl.to(siguiente, {
        x: posicionX(1) + EMPUJE,
        duration: DUR.rapida,
        ease: EASE.suave,
        repeat: 1,
        yoyo: true,
      }, '<+=0.25');
    }

    // 3) Termina: el bloque sale por la derecha, el slot se apaga
    tl.to(progreso, { autoAlpha: 0, duration: DUR.rapida });
    tl.to(slot, { borderColor: ACENTO_SUAVE, duration: DUR.rapida }, '<');
    tl.to(bloque, { x: SALIDA_X, autoAlpha: 0, duration: DUR.normal, ease: EASE.salida }, '<');
  });

  tl.addLabel('fin');
  esperar(tl, DUR.margen);

  configurarControles(tl);
  configurarNavegacion();
</script>
</body>
</html>
