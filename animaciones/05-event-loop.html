<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>05 · Event Loop</title>
  <link rel="stylesheet" href="../vendor/fuentes/fuentes.css">
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    /* ---------- Disposición de la escena ----------
       Izquierda: mini Call Stack.
       Centro-derecha: el anillo del event loop (grande, gira siempre).
       Abajo: zona de espera con los callbacks listos. */

    /* Pila y frames (aspecto en shared) */
    .el .slide__pila      { left: 80px; top: 240px; width: 320px; height: 520px; }
    .el .slide__pila-boca { left: 80px; top: 240px; width: 320px; }
    .el .slide__frame {
      --i: 0;
      left: 100px;
      top: calc(664px - var(--i) * 92px);
      width: 280px;
      height: 80px;
      font-size: 23px;
    }
    .el .slide__hilo-punto { left: 420px; top: 690px; }

    /* Veredicto de la revisión, arriba de la boca de la pila: ✓ vacía / ✗ ocupada */
    .veredicto {
      position: absolute;
      left: 190px;
      top: 120px;
      width: 100px;
      height: 100px;
      display: grid;
      place-items: center;
      font-size: 72px;
      font-weight: 700;
      color: var(--acento);
      visibility: hidden;
      opacity: 0;
    }
    .veredicto--no { opacity: 0.5; }

    /* Anillo del event loop, grande, centrado en (700, 420) */
    .el .event-loop { left: 590px; top: 310px; width: 220px; height: 220px; }
    .el .event-loop__anillo { border-width: 10px; }

    /* El "vigilante": puntito que sale del anillo a revisar la pila */
    .vigia {
      position: absolute;
      left: 690px;
      top: 410px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--acento);
      box-shadow: 0 0 18px var(--acento);
      visibility: hidden;
      opacity: 0;
    }

    /* Zona de espera y callbacks (GSAP los desplaza con x) */
    .el__espera { left: 440px; top: 780px; width: 560px; height: 160px; }
    .el .slide__callback { top: 810px; }
    #cb1 { left: 520px; }
    #cb2 { left: 680px; }
    #cb3 { left: 840px; }
  </style>
</head>
<body>

<div class="stage stage--cuadrado stage--slide el">

  <!-- Mini Call Stack -->
  <div class="slide__etiqueta" style="left: 80px; top: 780px;">Call Stack</div>
  <div class="slide__pila"></div>
  <div class="slide__pila-boca"></div>
  <div class="slide__frame" id="f-bloque" style="--i: 0"><span>BloqueCodigo</span>
    <svg viewBox="0 0 40 40"><circle class="slide__anillo-fondo" cx="20" cy="20" r="15" stroke-width="5"/>
      <circle class="slide__anillo-arco" cx="20" cy="20" r="15" stroke-width="5" stroke-dasharray="94.25" stroke-dashoffset="94.25" transform="rotate(-90 20 20)"/></svg>
  </div>
  <div class="slide__frame" id="f-fn1" style="--i: 1"><span>Fn1()</span>
    <svg viewBox="0 0 40 40"><circle class="slide__anillo-fondo" cx="20" cy="20" r="15" stroke-width="5"/>
      <circle class="slide__anillo-arco" cx="20" cy="20" r="15" stroke-width="5" stroke-dasharray="94.25" stroke-dashoffset="94.25" transform="rotate(-90 20 20)"/></svg>
  </div>
  <!-- Un solo frame callback() que se reutiliza para cada CB -->
  <div class="slide__frame" id="f-cb" style="--i: 0"><span>callback()</span>
    <svg viewBox="0 0 40 40"><circle class="slide__anillo-fondo" cx="20" cy="20" r="15" stroke-width="5"/>
      <circle class="slide__anillo-arco" cx="20" cy="20" r="15" stroke-width="5" stroke-dasharray="94.25" stroke-dashoffset="94.25" transform="rotate(-90 20 20)"/></svg>
  </div>
  <div class="slide__hilo-punto" id="hilo"></div>

  <div class="veredicto" id="ok">✓</div>
  <div class="veredicto veredicto--no" id="no">✗</div>

  <!-- Event loop -->
  <div class="event-loop" id="loop">
    <div class="event-loop__anillo" id="anillo"></div>
    <span class="event-loop__texto">Event<br>Loop</span>
  </div>
  <div class="vigia" id="vigia"></div>

  <!-- Callbacks listos -->
  <div class="slide__etiqueta" style="left: 440px; top: 950px;">Callbacks en espera</div>
  <div class="slide__espera el__espera"></div>
  <div class="slide__callback" id="cb1"><span class="slide__callback-titulo">CB1</span><span class="slide__callback-sub">Callback</span></div>
  <div class="slide__callback" id="cb2"><span class="slide__callback-titulo">CB2</span><span class="slide__callback-sub">Callback</span></div>
  <div class="slide__callback" id="cb3"><span class="slide__callback-titulo">CB3</span><span class="slide__callback-sub">Callback</span></div>

  <div class="ayuda oculto">
    <div class="ayuda__tarjeta">
      <h2>Controles</h2>
      <table>
        <tr><td><kbd>Espacio</kbd></td><td>Play / pausa</td></tr>
        <tr><td><kbd>R</kbd></td><td>Volver al inicio</td></tr>
        <tr><td><kbd>→</kbd> <kbd>←</kbd></td><td>Siguiente / anterior paso</td></tr>
        <tr><td><kbd>H</kbd></td><td>Mostrar / ocultar esta ayuda</td></tr>
      </table>
    </div>
  </div>
  <div class="pista">Espacio para empezar · H ayuda</div>

</div>

<script src="../vendor/gsap.min.js"></script>
<script src="../shared/controls.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const stage = document.querySelector('.stage');
  const loop = $('loop'), anillo = $('anillo'), vigia = $('vigia'), hilo = $('hilo');
  const ok = $('ok'), no = $('no');
  const fBloque = $('f-bloque'), fFn1 = $('f-fn1'), fCb = $('f-cb');
  const cb1 = $('cb1'), cb2 = $('cb2'), cb3 = $('cb3');

  const ACENTO = getComputedStyle(stage).getPropertyValue('--acento').trim();
  const FONDO  = getComputedStyle(stage).getPropertyValue('--fondo').trim();

  // ---------- Medidas y tiempos de esta escena ----------
  const ALTO_NIVEL   = 92;     // separación vertical entre frames (igual que en el CSS)
  const Y_BOCA       = -524;   // desplazamiento del frame 0 hasta arriba de la boca
  const PERIMETRO    = 94.25;
  const VIGIA_A_PILA = { x: -460, y: -240 };   // del centro del anillo a la boca de la pila
  const CB_A_ANILLO  = { x: 130, y: -440 };    // del primer lugar de la fila al centro del anillo
  const CB_A_BOCA    = { x: -330, y: -690 };   // del primer lugar de la fila a la boca de la pila
  const PASO_FILA    = 160;    // separación entre callbacks en la fila
  const T_MOVER      = 1.0;    // entrar/salir de la pila
  const T_CAMBIO     = 0.5;    // encender/pausar, mover el punto del hilo
  const T_TRABAJO    = 1.2;    // lo que tarda cada función en ejecutarse
  const T_REVISION   = 0.5;    // viaje del vigía hasta la pila
  const T_VEREDICTO  = 0.8;    // cuánto se ve el ✓ / ✗
  const T_SIN_LOOP   = 3.5;    // cuánto tiempo está apagado el event loop
  const VUELTAS_POR_SEG = 0.4; // velocidad del anillo

  // ---------- Timeline ----------
  const tl = gsap.timeline({
    paused: true,
    defaults: { duration: DUR.normal, ease: EASE.suave },
  });

  // --- Helpers de la pila (mismos que en 04) ---
  const nivel = (frame) => Number(frame.style.getPropertyValue('--i'));
  const arco  = (frame) => frame.querySelector('.slide__anillo-arco');
  const apilarFrame = (frame, pos) => tl.fromTo(frame,
    { y: Y_BOCA + nivel(frame) * ALTO_NIVEL, autoAlpha: 0 },
    { y: 0, autoAlpha: 1, duration: T_MOVER, ease: 'power3.out' }, pos);
  const desapilarFrame = (frame, pos) => tl.to(frame,
    { y: Y_BOCA + nivel(frame) * ALTO_NIVEL, autoAlpha: 0, duration: T_MOVER, ease: 'power3.in' }, pos);
  const activar = (frame, pos) => tl.to(frame, { backgroundColor: ACENTO, color: FONDO, duration: T_CAMBIO }, pos);
  const pausar  = (frame, pos) => tl.to(frame, { backgroundColor: FONDO, color: ACENTO, duration: T_CAMBIO }, pos);
  const trabajar = (frame, desde, hasta, seg, pos) => tl.fromTo(arco(frame),
    { strokeDashoffset: PERIMETRO * (1 - desde) },
    { strokeDashoffset: PERIMETRO * (1 - hasta), duration: seg, ease: 'none' }, pos);
  const señalar = (frame, pos) => tl.to(hilo,
    { y: -nivel(frame) * ALTO_NIVEL, autoAlpha: 1, duration: T_CAMBIO, ease: EASE.mover }, pos);
  const apagarHilo = (pos) => tl.to(hilo, { autoAlpha: 0, duration: T_CAMBIO }, pos);

  // --- El event loop revisa la pila: el vigía viaja y muestra ✓ (vacía) o ✗ (ocupada) ---
  function revisar(vacia, etiqueta) {
    tl.addLabel(etiqueta);
    tl.fromTo(vigia, { x: 0, y: 0, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 });
    tl.to(vigia, { ...VIGIA_A_PILA, duration: T_REVISION, ease: EASE.mover }, '<');
    tl.to(vigia, { autoAlpha: 0, duration: 0.2 });
    const veredicto = vacia ? ok : no;
    tl.fromTo(veredicto, { autoAlpha: 0, scale: 0.5 }, { autoAlpha: 1, scale: 1, duration: DUR.rapida, ease: EASE.entrada }, '<');
    tl.to(veredicto, { autoAlpha: 0, duration: DUR.rapida }, `>+=${T_VEREDICTO}`);
  }

  // --- El event loop lleva un callback (que está en el primer lugar de la fila) a la pila ---
  // `x0` es el desplazamiento que ya tiene el callback (0 si nació en el primer lugar).
  function moverCallback(cb, etiqueta, x0 = 0) {
    tl.addLabel(etiqueta);
    tl.to(loop, { scale: 1.12, duration: DUR.rapida, repeat: 1, yoyo: true, ease: 'sine.inOut' });
    tl.to(cb, { x: x0 + CB_A_ANILLO.x, y: CB_A_ANILLO.y, scale: 0.8, duration: T_MOVER, ease: EASE.mover }, '<');
    tl.to(cb, { x: x0 + CB_A_BOCA.x, y: CB_A_BOCA.y, duration: T_MOVER, ease: EASE.mover });
    apilarFrame(fCb);
    tl.to(cb, { autoAlpha: 0, duration: T_CAMBIO }, '<');
    señalar(fCb, '<');
    activar(fCb, '<');
    trabajar(fCb, 0, 1, T_TRABAJO);
    desapilarFrame(fCb);
    apagarHilo('<');
  }

  // Estado inicial: BloqueCodigo y Fn1 en la pila (Fn1 ejecutando), CB1 y CB2 listos
  gsap.set(fBloque, { autoAlpha: 1 });
  gsap.set(fFn1, { autoAlpha: 1, backgroundColor: ACENTO, color: FONDO });
  gsap.set(arco(fBloque), { strokeDashoffset: PERIMETRO * 0.6 });
  gsap.set(hilo, { y: -ALTO_NIVEL, autoAlpha: 1 });

  tl.addLabel('inicio');
  esperar(tl, DUR.margen);


  // 1) El loop revisa: la pila está ocupada → ✗. Mientras, Fn1 termina y BloqueCodigo también.
  revisar(false, 'revisa-ocupada');
  trabajar(fFn1, 0.3, 1, T_TRABAJO, '<');
  tl.addLabel('pop-fn1');
  desapilarFrame(fFn1);
  señalar(fBloque, '<');
  activar(fBloque, '<');
  trabajar(fBloque, 0.4, 1, T_TRABAJO);
  tl.addLabel('pop-bloque');
  desapilarFrame(fBloque);
  apagarHilo('<');

  // 2) Revisa: vacía → ✓ → lleva CB1 a la pila. CB2 avanza en la fila.
  revisar(true, 'revisa-vacia-1');
  moverCallback(cb1, 'mueve-cb1');
  tl.to([cb2, cb3], { x: -PASO_FILA, duration: DUR.lenta, ease: EASE.mover }, 'mueve-cb1+=1');

  // 3) Revisa: vacía → ✓ → lleva CB2.
  revisar(true, 'revisa-vacia-2');
  moverCallback(cb2, 'mueve-cb2', -PASO_FILA);
  tl.to(cb3, { x: -PASO_FILA * 2, duration: DUR.lenta, ease: EASE.mover }, 'mueve-cb2+=1');

  // 4) Sin event loop: el anillo se apaga y se detiene. CB3 está listo... y nadie lo mueve.
  tl.addLabel('sin-event-loop');
  const tApagado = tl.duration();
  tl.to(loop, { opacity: 0.25, duration: DUR.lenta });

  tl.to(cb3, { opacity: 0.45, duration: 0.45, repeat: 5, yoyo: true, ease: 'sine.inOut' }, '<+=0.5');


  // 5) Vuelve el event loop: se enciende, revisa (✓) y CB3 por fin se ejecuta.
  tl.addLabel('vuelve-event-loop', tApagado + T_SIN_LOOP);
  const tEncendido = tApagado + T_SIN_LOOP;
  tl.to(loop, { opacity: 1, duration: DUR.lenta }, 'vuelve-event-loop');
  revisar(true, 'revisa-vacia-3');
  moverCallback(cb3, 'mueve-cb3', -PASO_FILA * 2);

  tl.addLabel('fin');
  esperar(tl, DUR.margen);

  // --- Giro del anillo: continuo, salvo mientras el loop está apagado ---
  const vueltas = (seg) => 360 * Math.max(1, Math.round(seg * VUELTAS_POR_SEG));
  const total = tl.duration();
  const g1 = vueltas(tApagado);
  tl.fromTo(anillo, { rotation: 0 }, { rotation: g1, duration: tApagado, ease: 'none' }, 0);
  tl.to(anillo, { rotation: g1 + 40, duration: 1.0, ease: 'power2.out' }, tApagado);            // frena
  tl.to(anillo, { rotation: g1 + 80, duration: 1.0, ease: 'power2.in' }, tEncendido);          // arranca
  tl.to(anillo, { rotation: g1 + 80 + vueltas(total - tEncendido - 1), duration: total - tEncendido - 1, ease: 'none' }, tEncendido + 1);

  configurarControles(tl);
</script>
</body>
</html>
